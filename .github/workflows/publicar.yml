# Publica Yada en GitHub Pages cada vez que cambia el repositorio.
# Compila los estudios LaTeX (PDF), genera sus páginas web y renderiza el sitio Quarto.
name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # para las fechas de cada estudio

      - name: Instalar XeLaTeX
        timeout-minutes: 25
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fonts-texgyre texlive-xetex texlive-latex-extra texlive-latex-recommended \
            texlive-lang-greek texlive-lang-european texlive-pictures \
            texlive-fonts-recommended texlive-science poppler-utils ffmpeg

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Instalar segno (códigos QR) y Pillow (relieve liviano de las líneas para el celular)
        run: python3 -m pip install --break-system-packages segno pillow || python3 -m pip install segno pillow

      - name: Compilar los estudios LaTeX y generar sus páginas
        run: python3 scripts/atributos.py

      - name: Publicar las predicaciones (PDF y audio)
        run: python3 scripts/predicaciones.py

      - name: Integrar las líneas de tiempo en sus páginas
        run: python3 scripts/lineas.py

      - name: Renderizar el sitio
        run: quarto render

      - name: Marcar la versión publicada (para que todos los dispositivos carguen lo último)
        run: |
          VER="${GITHUB_SHA::8}"
          echo "$VER" > _site/version.txt
          find _site -name '*.html' -not -path '_site/app/*' -exec sed -i "s/__PL_BUILD__/$VER/g" {} +
          grep -l "pl-build\" content=\"$VER" _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
