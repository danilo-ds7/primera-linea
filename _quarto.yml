project:
  type: website
  output-dir: _site
  pre-render:
    - scripts/atributos.py       # convierte los estudios LaTeX en páginas y PDF (todas las series)
    - scripts/predicaciones.py   # publica las predicaciones (PDF + audio) de estudios/predicaciones/
    - scripts/lineas.py          # integra las líneas de tiempo de estudios/lineas/ en sus páginas
  resources:
    - "robots.txt"
    - "app/**"
    - "datos/**"
    - "sincronia/**"
    - "atributos/pdf/**"
    - "atributos/img/**"
    - "festividades/pdf/**"
    - "festividades/img/**"
    - "israel/pdf/**"
    - "israel/img/**"
    - "predicaciones/pdf/**"
    - "predicaciones/audio/**"
    - "lineas/*-linea.html"
    - "lineas/*/img/**"
    - "lineas/*/fonts/**"
    - "lineas/*/mapa/**"
    - "lineas/*/relieve/**"
    - "lineas/*/vendor/**"
  render:
    - "*.qmd"
    - "estudios/*.qmd"
    - "atributos/*.qmd"
    - "festividades/*.qmd"
    - "israel/*.qmd"
    - "predicaciones/*.qmd"
    - "lineas/*.qmd"

website:
  title: "Primera Línea"
  site-url: "https://primera-linea.cl"
  navbar:
    left:
      - href: predicaciones.qmd
        text: Predicaciones
      - text: Estudios
        menu:
          - href: atributos.qmd
            text: Atributos de Dios
          - href: mesias.qmd
            text: Jesús, el Mesías prometido
          - href: israel.qmd
            text: Israel y su restauración
          - href: festividades.qmd
            text: Festividades santas
          - href: pablo.qmd
            text: "Bonus: Palabras difíciles de Pablo"
          - href: estudios.qmd
            text: Todos los estudios
          - href: diccionarios.qmd
            text: Diccionarios bíblicos
      - href: lineas.qmd
        text: Líneas de tiempo
      - href: metodologia.qmd
        text: Metodología
      - href: videos.qmd
        text: Videos
      - href: podcast.qmd
        text: Podcast
      - href: app/index.html
        text: Lector
      - href: index.qmd#contacto
        text: Contacto
    right:
      - icon: instagram
        href: https://www.instagram.com/danilo_gomez_correa/
  page-footer:
    left: "© 2026 Danilo Gómez Correa · Primera Línea"

format:
  html:
    theme: [cosmo, styles.scss]
    lang: es
    section-divs: false
    anchor-sections: false
    toc: false
    include-in-header: _includes/version.html
    include-after-body: _includes/citas.html
    citations-hover: true
    footnotes-hover: true

bibliography: referencias.bib
csl: apa.csl
